# test.payplus.live -> Next.js on 127.0.0.1:7987 (pm2 app "payplus-test-store")
#
# Needs the TLS certificate first:  sudo certbot certonly --nginx -d test.payplus.live
# Install:  sudo cp deploy/nginx/test.payplus.live.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/test.payplus.live.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

upstream payplus_test_store {
    server 127.0.0.1:7987;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.payplus.live;

    return 301 https://$host$request_uri;
}

server {
    # On nginx >= 1.25.1 you can write "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.payplus.live;

    ssl_certificate     /etc/letsencrypt/live/test.payplus.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.payplus.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    access_log /var/log/nginx/test.payplus.live.access.log;
    error_log  /var/log/nginx/test.payplus.live.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # [auth] Optional password for the store. Recommended, since the site creates
    # payments with your live API key. Create the file first:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-payplus-test <username>
    # then uncomment every line marked [auth].
    # auth_basic "Payplus test store";                         # [auth]
    # auth_basic_user_file /etc/nginx/.htpasswd-payplus-test;  # [auth]

    # Payplus webhook deliveries (POST) must never be asked for a password; the
    # HMAC signature check in the app protects them. GET (the UI's event list)
    # stays behind the password when [auth] is on.
    location = /api/webhook {
        auth_basic off;
        # limit_except POST {                                        # [auth]
        #     auth_basic "Payplus test store";                       # [auth]
        #     auth_basic_user_file /etc/nginx/.htpasswd-payplus-test; # [auth]
        # }                                                          # [auth]
        proxy_pass http://payplus_test_store;
    }

    location / {
        proxy_pass http://payplus_test_store;
    }
}
